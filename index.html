<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>자유의 여신상 · 3D 착시 극장</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050815;color:#fff;font-family:system-ui,'Malgun Gothic',sans-serif}#scene{position:fixed;inset:0;touch-action:none}#frame{pointer-events:none;position:fixed;inset:7% 7% 17%;border:7px solid #a6dfff;border-radius:14px;box-shadow:0 0 24px #4bcfff55,inset 0 0 28px #4bcfff33;opacity:.75}#frame:after{content:'';position:absolute;inset:10px;border:1px solid #ffffff44;border-radius:6px}.top{position:fixed;top:15px;left:14px;right:14px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start;pointer-events:none}.badge{background:#071326c9;border:1px solid #4ccaff66;border-radius:12px;padding:10px 12px;backdrop-filter:blur(6px)}.badge strong{font-size:15px}.badge small{display:block;color:#c2eaff;font-size:11px;margin-top:3px}#status{font-size:12px;color:#aeeaff;max-width:42%;text-align:right}.bottom{position:fixed;bottom:env(safe-area-inset-bottom,12px);left:10px;right:10px;display:flex;flex-direction:column;align-items:center;gap:9px}.buttons{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}button{border:1px solid #70d8ff88;border-radius:12px;background:#09233bde;color:white;font-size:14px;padding:11px 13px;cursor:pointer}button:active{background:#16618b}.help{text-align:center;font-size:12px;line-height:1.5;color:#d6ebff;background:#050d1ac9;padding:7px 10px;border-radius:9px;max-width:95%}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#030713ed;z-index:5;font-size:15px;text-align:center;padding:20px}#loading[hidden]{display:none}.note{font-size:11px;color:#9bb8d0}
</style>
</head>
<body>
<div id="scene"></div><div id="frame"></div>
<div class="top"><div class="badge"><strong>자유의 여신상 · 3D 착시 극장</strong><small>카메라 없는 원근 착시 실험</small></div><div class="badge" id="status">준비 중…</div></div>
<div class="bottom"><div class="buttons"><button id="replay">▶ 등장 다시 보기</button><button id="toggle">⏸ 자동 회전 정지</button><button id="gyro">📱 기울이기 사용</button><button id="reset">↺ 시점 초기화</button></div><div class="help">한 손가락: 회전 · 두 손가락: 확대/축소 · 기울이기: 시점 변화<br><span class="note">화면 밖으로 실제 영상이 나오는 것은 아닙니다. 시각적 착시 실험입니다.</span></div></div>
<div id="loading">자유의 여신상 3D 모델을 불러오는 중입니다…</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050815);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.01,200);camera.position.set(0,0,9);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.5;document.getElementById('scene').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xbbeeff,0x302025,2.1));const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(4,8,7);scene.add(key);const rim=new THREE.DirectionalLight(0x3edcff,2.6);rim.position.set(-4,3,-3);scene.add(rim);
const group=new THREE.Group();scene.add(group);let model,playing=true,gyroEnabled=false,gyroX=0,gyroY=0,rotX=0,rotY=0,zoom=1,animStart=performance.now(),arrival=true;
const status=document.getElementById('status');const loader=new GLTFLoader();
// 동일 저장소에 GLB를 올리면 로컬 파일을 우선 사용합니다.
// 없으면 기존 MR 저장소의 공개 GLB 파일을 불러옵니다.
const candidates=['./statue_of_liberty_1.glb','https://ilmac-knu.github.io/statue-liberty-touch-mr/statue_of_liberty_1.glb'];
function loadAt(i){loader.load(candidates[i],g=>{model=g.scene;const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());model.position.sub(center);const max=Math.max(size.x,size.y,size.z);model.scale.setScalar(3.25/max);group.add(model);document.getElementById('loading').hidden=true;status.textContent='모델 준비 완료';animStart=performance.now();},undefined,e=>{if(i+1<candidates.length)loadAt(i+1);else{document.getElementById('loading').innerHTML='모델을 불러오지 못했습니다.<br>GLB 파일을 같은 저장소에 올리고 새로고침하세요.';status.textContent='모델 로딩 오류';console.error(e);}})}loadAt(0);
function replay(){arrival=true;animStart=performance.now();group.rotation.set(0,0,0);rotX=rotY=0;zoom=1}document.getElementById('replay').onclick=replay;
document.getElementById('toggle').onclick=e=>{playing=!playing;e.currentTarget.textContent=playing?'⏸ 자동 회전 정지':'▶ 자동 회전 시작'};
document.getElementById('reset').onclick=()=>{rotX=rotY=gyroX=gyroY=0;zoom=1;group.rotation.set(0,0,0)};
document.getElementById('gyro').onclick=async e=>{if(!gyroEnabled&&typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){try{const p=await DeviceOrientationEvent.requestPermission();if(p!=='granted'){status.textContent='기울이기 권한 거부';return}}catch(err){status.textContent='기울이기 권한 오류';return}}gyroEnabled=!gyroEnabled;e.currentTarget.textContent=gyroEnabled?'📱 기울이기 끄기':'📱 기울이기 사용';if(gyroEnabled)status.textContent='기울이기 활성화'};
window.addEventListener('deviceorientation',e=>{if(gyroEnabled){gyroY=THREE.MathUtils.clamp((e.gamma||0)/90,-.35,.35);gyroX=THREE.MathUtils.clamp((e.beta||0)/180,-.22,.22)}});
let points=new Map(),lastDist=null,lastX=0,lastY=0;const canvas=renderer.domElement;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);points.set(e.pointerId,{x:e.clientX,y:e.clientY});lastX=e.clientX;lastY=e.clientY});
canvas.addEventListener('pointermove',e=>{if(!points.has(e.pointerId))return;const old=points.get(e.pointerId);points.set(e.pointerId,{x:e.clientX,y:e.clientY});if(points.size===1){rotY+=(e.clientX-old.x)*.007;rotX+=(e.clientY-old.y)*.005;rotX=THREE.MathUtils.clamp(rotX,-.7,.7)}else if(points.size===2){const a=[...points.values()];const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastDist)zoom=THREE.MathUtils.clamp(zoom*d/lastDist,.65,1.8);lastDist=d}});
function end(e){points.delete(e.pointerId);lastDist=null}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=THREE.MathUtils.clamp(zoom*Math.exp(-e.deltaY*.001),.65,1.8)},{passive:false});
function ease(t){return 1-Math.pow(1-t,3)}
let prev=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-prev)/1000,.05);prev=now;if(model){let progress=1;if(arrival){progress=Math.min((now-animStart)/5200,1);if(progress===1){arrival=false;status.textContent='손가락으로 조작해 보세요'}}const t=ease(progress);const dist=THREE.MathUtils.lerp(19,4.65,t);camera.position.z=dist/zoom;group.rotation.y=rotY+gyroY+(playing?now*.00025:0);group.rotation.x=rotX+gyroX;group.position.y=THREE.MathUtils.lerp(-.18,0,t);if(arrival)status.textContent=`등장 연출 ${Math.round(progress*100)}%`;}renderer.render(scene,camera)}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
