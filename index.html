<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>자유의 여신상 · 3D 착시 극장</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050815;color:white;font-family:system-ui,'Malgun Gothic',sans-serif}#scene{position:fixed;inset:0;touch-action:none}#frame{pointer-events:none;position:fixed;inset:10% 6% 18%;border:5px solid #8bdcff;border-radius:15px;box-shadow:0 0 25px #3bc9ff77,inset 0 0 24px #3bc9ff33}.top{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.badge{background:#061326e8;border:1px solid #4ccaff66;border-radius:12px;padding:9px 12px;font-size:13px}.badge small{display:block;font-size:11px;color:#b9e7ff}.bottom{position:fixed;bottom:12px;left:8px;right:8px;text-align:center}.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}button{border:1px solid #70d8ff88;border-radius:10px;background:#09233bea;color:white;padding:11px;font-size:13px}.help{margin-top:9px;font-size:11px;color:#d6ebff;background:#050d1ab8;padding:7px;border-radius:8px}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#030713ee;z-index:5;text-align:center;padding:24px}#loading[hidden]{display:none}
</style></head><body><div id="scene"></div><div id="frame"></div><div class="top"><div class="badge"><b>자유의 여신상 · 3D 착시 극장</b><small>카메라 없는 원근 착시 실험</small></div><div class="badge" id="status">준비 중…</div></div><div class="bottom"><div class="buttons"><button id="replay">▶ 등장 다시 보기</button><button id="toggle">⏸ 자동 회전 정지</button><button id="gyro">📱 기울이기 사용</button><button id="reset">↺ 시점 초기화</button></div><div class="help">한 손가락: 회전 · 두 손가락: 확대/축소 · 기울이기: 시점 변화<br>실제 화면 밖으로 영상이 나오는 것은 아닙니다.</div></div><div id="loading">자유의 여신상 3D 모델을 불러오는 중입니다…</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050815);const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.01,200);camera.position.set(0,0,9);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.6;document.querySelector('#scene').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xbbeeff,0x302025,2.3));const light=new THREE.DirectionalLight(0xffffff,3.5);light.position.set(4,8,7);scene.add(light);const rim=new THREE.DirectionalLight(0x3edcff,2.4);rim.position.set(-4,3,-3);scene.add(rim);
const group=new THREE.Group();scene.add(group);let model=null,playing=true,gyroEnabled=false,gyroX=0,gyroY=0,rotX=0,rotY=0,zoom=1,animStart=performance.now(),arrival=true;const status=document.querySelector('#status');const loading=document.querySelector('#loading');
const paths=['./statue_of_liberty_1.glb','https://ilmac-knu.github.io/statue-liberty-touch-mr/statue_of_liberty_1.glb'];const loader=new GLTFLoader();
function loadAt(i){loader.load(paths[i],g=>{model=g.scene;model.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(model);const size=box.getSize(new THREE.Vector3());const center=box.getCenter(new THREE.Vector3());const max=Math.max(size.x,size.y,size.z);if(!Number.isFinite(max)||max<=0)throw new Error('모델 크기를 확인할 수 없습니다');
// 수정 핵심: 원본 모델을 중심으로 옮긴 뒤 별도의 부모 그룹에 크기 배율 적용.
const pivot=new THREE.Group();model.position.copy(center).multiplyScalar(-1);pivot.add(model);pivot.scale.setScalar(3.25/max);group.add(pivot);loading.hidden=true;status.textContent='모델 준비 완료';animStart=performance.now();},undefined,e=>{console.error('GLB 로딩 오류',e);if(i+1<paths.length)loadAt(i+1);else{loading.innerHTML='모델을 불러오지 못했습니다.<br>파일 경로와 브라우저 콘솔을 확인하세요.';status.textContent='로딩 오류'}})}loadAt(0);
function replay(){arrival=true;animStart=performance.now();rotX=rotY=0;zoom=1}document.querySelector('#replay').onclick=replay;document.querySelector('#toggle').onclick=e=>{playing=!playing;e.currentTarget.textContent=playing?'⏸ 자동 회전 정지':'▶ 자동 회전 시작'};document.querySelector('#reset').onclick=()=>{rotX=rotY=gyroX=gyroY=0;zoom=1};document.querySelector('#gyro').onclick=async e=>{if(!gyroEnabled&&typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){try{if(await DeviceOrientationEvent.requestPermission()!=='granted')return}catch(err){status.textContent='기울이기 권한 오류';return}}gyroEnabled=!gyroEnabled;e.currentTarget.textContent=gyroEnabled?'📱 기울이기 끄기':'📱 기울이기 사용'};addEventListener('deviceorientation',e=>{if(gyroEnabled){gyroY=THREE.MathUtils.clamp((e.gamma||0)/90,-.35,.35);gyroX=THREE.MathUtils.clamp((e.beta||0)/180,-.22,.22)}});
const pointers=new Map();let lastDist=null;const canvas=renderer.domElement;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY})});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){rotY+=(e.clientX-old.x)*.007;rotX=THREE.MathUtils.clamp(rotX+(e.clientY-old.y)*.005,-.7,.7)}else if(pointers.size===2){const a=[...pointers.values()];const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastDist)zoom=THREE.MathUtils.clamp(zoom*d/lastDist,.65,1.8);lastDist=d}});function end(e){pointers.delete(e.pointerId);lastDist=null}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=THREE.MathUtils.clamp(zoom*Math.exp(-e.deltaY*.001),.65,1.8)},{passive:false});
function ease(t){return 1-Math.pow(1-t,3)}function animate(now){requestAnimationFrame(animate);if(model){let progress=1;if(arrival){progress=Math.min((now-animStart)/5200,1);if(progress===1){arrival=false;status.textContent='손가락으로 조작해 보세요'}}const t=ease(progress);camera.position.z=THREE.MathUtils.lerp(19,4.65,t)/zoom;group.rotation.y=rotY+gyroY+(playing?now*.00025:0);group.rotation.x=rotX+gyroX;group.position.y=THREE.MathUtils.lerp(-.18,0,t);if(arrival)status.textContent=`등장 연출 ${Math.round(progress*100)}%`}renderer.render(scene,camera)}requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
